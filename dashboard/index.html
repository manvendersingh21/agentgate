<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentGate - Autonomous PR Safety Loop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header .tagline {
            font-size: 20px;
            opacity: 0.95;
        }
        
        .mode-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .dashboard {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        .start-button {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 30px;
        }
        
        .start-button:hover {
            transform: translateY(-2px);
        }
        
        .start-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .pipeline {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .stage {
            padding: 24px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .stage.active {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        
        .stage.success {
            background: #d4edda;
            border-left-color: #28a745;
        }
        
        .stage.error {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        
        .stage-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .stage-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .stage-status {
            font-size: 32px;
        }
        
        .stage-details {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
        }
        
        .metric {
            display: inline-block;
            background: white;
            padding: 8px 16px;
            border-radius: 8px;
            margin-right: 12px;
            margin-top: 8px;
            font-weight: 600;
        }
        
        .metric.critical {
            background: #dc3545;
            color: white;
        }
        
        .metric.success {
            background: #28a745;
            color: white;
        }
        
        .risk-meter {
            margin-top: 12px;
            padding: 16px;
            background: white;
            border-radius: 8px;
        }
        
        .risk-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .risk-bar {
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .risk-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #ffc107, #dc3545);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            color: white;
            font-weight: 700;
        }
        
        .findings-panel {
            margin-top: 12px;
            padding: 16px;
            background: white;
            border-radius: 8px;
        }
        
        .finding {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .finding-severity {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            margin-right: 8px;
        }
        
        .severity-critical {
            background: #dc3545;
            color: white;
        }
        
        .pr-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }
        
        .hidden {
            display: none;
        }

        .probs {
            margin-top: 12px;
            background: white;
            border-radius: 8px;
            padding: 12px;
        }

        .prob-row {
            display: grid;
            grid-template-columns: 120px 1fr 48px;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
            font-size: 14px;
        }

        .prob-track {
            height: 10px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
        }

        .prob-fill {
            height: 100%;
            background: #667eea;
        }

        .source-label {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ AgentGate</h1>
            <div class="tagline">Autonomous PR Safety Loop</div>
            <div class="mode-badge" id="modeBadge">Loading...</div>
        </div>
        
        <div class="dashboard">
            <button class="start-button" id="startButton" onclick="startDemo()">
                Start Demo
            </button>
            
            <div id="content" class="hidden">
                <div class="pr-title" id="prTitle">PR #0 — Loading...</div>
                
                <div class="pipeline" id="pipeline">
                    <!-- Stages will be added dynamically -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let eventSource = null;
        let rows = [];

        fetch('/api/state')
            .then(r => r.json())
            .then(state => {
                document.getElementById('modeBadge').textContent =
                    `Mode: ${state.mode.toUpperCase()}`;
            });

        function startDemo() {
            const button = document.getElementById('startButton');
            button.disabled = true;
            button.textContent = 'Running...';
            rows = [];
            document.getElementById('content').classList.remove('hidden');
            document.getElementById('pipeline').innerHTML = '';
            if (eventSource) eventSource.close();
            eventSource = new EventSource('/api/events');
            eventSource.onmessage = handleEvent;
            fetch('/api/start', { method: 'POST' });
        }

        function handleEvent(e) {
            const event = JSON.parse(e.data);
            if (event.pr_number > 0) {
                document.getElementById('prTitle').textContent =
                    `PR #${event.pr_number} — Add refund endpoint`;
            }
            if (event.type === 'builder_complete') {
                rows.push({ title: 'Builder', status: 'success', html: '✅ Complete' });
            } else if (event.type === 'loop_failed') {
                rows.push({
                    title: 'Loop',
                    status: 'error',
                    html: `⚠️ ${event.data.error || 'Demo failed'}`
                });
                document.getElementById('startButton').disabled = false;
                document.getElementById('startButton').textContent = 'Start Demo';
            } else if (event.type === 'review_complete') {
                const findings = event.data.findings || [];
                rows.push({
                    title: 'CodeRabbit',
                    status: findings.length ? 'error' : 'success',
                    html: reviewHtml(event.data)
                });
            } else if (event.type === 'decision_complete') {
                rows.push({
                    title: 'Jev',
                    status: event.data.action === 'merge' ? 'success' : 'error',
                    html: decisionHtml(event.data)
                });
            } else if (event.type === 'fix_complete') {
                const live = event.data.agent === 'coderabbit-coding-agent';
                const ok = event.data.success !== false;
                const detail = event.data.message || (ok ? 'Fix applied' : 'Fix failed');
                rows.push({
                    title: live ? 'CodeRabbit Coding Agent' : 'Fixer',
                    status: ok ? 'success' : 'error',
                    html: live
                        ? `${ok ? '✅' : '⚠️'} ${detail}`
                        : `${ok ? '✅' : '⚠️'} ${detail}. Offline stand-in. Live mode posts @coderabbitai autofix.`
                });
            } else if (event.type === 'merge_complete') {
                rows.push({ title: 'Merge', status: 'success', html: '✅ PR MERGED' });
                document.getElementById('startButton').textContent = 'Demo Complete!';
            } else {
                return;
            }
            renderRows();
        }

        function reviewHtml(data) {
            const findings = data.findings || [];
            const blocking = findings.filter(f => f.severity === 'critical' || f.severity === 'security');
            if (!findings.length) return '<span class="metric success">🟢 Clean</span>';
            const shown = blocking[0] || findings[0];
            const label = (shown.severity || 'finding').toUpperCase();
            const text = `<div class="finding"><span class="finding-severity severity-critical">${label}</span> ${shown.message}</div>`;
            const count = blocking.length || findings.length;
            return `<span class="metric critical">🔴 ${count} blocking</span>${text}`;
        }

        function decisionHtml(data) {
            const probs = data.probabilities || {};
            const bars = Object.entries(probs).sort((a, b) => b[1] - a[1]).map(([name, p]) => `
                <div class="prob-row">
                    <span>${name}</span>
                    <div class="prob-track"><div class="prob-fill" style="width:${(p * 100).toFixed(0)}%"></div></div>
                    <span>${(p * 100).toFixed(0)}%</span>
                </div>`).join('');
            const source = data.source ? `<div class="source-label">${data.source}</div>` : '';
            return `
                <span class="metric">Decision: <strong>${String(data.action).toUpperCase()}</strong></span>
                <span class="metric">Confidence: ${Number(data.confidence).toFixed(1)}%</span>
                <div class="risk-meter">
                    <div class="risk-label"><span>Jev Risk</span><span>${Number(data.risk).toFixed(1)} / 10</span></div>
                    <div class="risk-bar"><div class="risk-fill" style="width:${Math.min(data.risk * 10, 100)}%">${Number(data.risk).toFixed(1)}</div></div>
                </div>
                ${bars ? `<details open class="probs"><summary>Jev action probabilities</summary>${bars}</details>` : ''}
                ${source}`;
        }

        function renderRows() {
            const pipeline = document.getElementById('pipeline');
            pipeline.innerHTML = '';
            rows.forEach(row => {
                const div = document.createElement('div');
                div.className = `stage ${row.status}`;
                const icon = row.status === 'success' ? '✅' : '🔴';
                div.innerHTML = `
                    <div class="stage-header">
                        <div class="stage-title">${row.title}</div>
                        <div class="stage-status">${icon}</div>
                    </div>
                    <div class="stage-details">${row.html}</div>`;
                pipeline.appendChild(div);
            });
        }
    </script>
</body>
</html>
